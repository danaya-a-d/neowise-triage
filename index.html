<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { cursor: progress; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <section id="ready" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="6"></textarea>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const MESSAGES = {
      loading: "Разбираем…",
      manualReview: "Не удалось разобрать автоматически — разберите заявку вручную",
      invalidInput: "Введите текст заявки",
      unavailable: "Сервис недоступен — разберите заявку вручную",
    };

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const ready = document.querySelector("#ready");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    let controller = null;
    let lastRequestId = 0;

    function clearResult() {
      status.textContent = "";
      topic.textContent = "";
      draft.value = "";
      ready.hidden = true;
    }

    function showMessage(text) {
      clearResult();
      status.textContent = text;
    }

    function showReady(data) {
      clearResult();
      topic.textContent = TOPIC_LABELS[data.topic] ?? data.topic;
      draft.value = data.draft;
      ready.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      controller?.abort();
      controller = new AbortController();
      const requestId = ++lastRequestId;

      showMessage(MESSAGES.loading);
      button.disabled = true;

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: controller.signal,
        });
        // Невалидный JSON в ответе превращаем в null — дальше это «сервис недоступен».
        const data = reply.ok ? await reply.json().catch(() => null) : null;
        if (requestId !== lastRequestId) return;

        if (reply.status === 400) {
          showMessage(MESSAGES.invalidInput);
        } else if (reply.status === 200 && data?.status === "ready" && typeof data.draft === "string") {
          showReady(data);
        } else if (reply.status === 200 && data?.status === "manual_review") {
          showMessage(MESSAGES.manualReview);
        } else {
          showMessage(MESSAGES.unavailable);
        }
      } catch (error) {
        if (error.name === "AbortError" || requestId !== lastRequestId) return;
        showMessage(MESSAGES.unavailable);
      } finally {
        if (requestId === lastRequestId) button.disabled = false;
      }
    });
  </script>
</body>
</html>
